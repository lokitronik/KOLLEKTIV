    <script>
      // SPA redirect fallback for GitHub Pages
      const l = window.location;
      if (l.search[1] !== '/') {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.substring(0, l.pathname.lastIndexOf('/') + 1));
      }
    </script>
  </head>
